<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadarChart</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
   <h1>Radar Charts</h1>
   <div>
      <canvas id="RadarChart"></canvas>
   </div>
   
</body>
<script>
    class radarChart{
        constructor(canvasId,dataUrl){
            this.canvasId = canvasId;
            this.dataUrl = dataUrl;
            this.chart =null;
        }
   renderChart(data){
        const ctx = document.getElementById(this.canvasId).getContext("2d");
    
        this.chart = new Chart0(ctx,{
            type: "radar",
            data:{
                labels:data.labels,
                datasets: data.datasets
            },
            options:{
                Response: true,
                Plugins:{
                    legend:{
                        position: "top"
                    },
                    title:{
                        display:true,
                        text:"Radar Chart"
                    }
                },
                scales:{
                    r:{
                        angleLine:{display:true},
                        suggestionMax:100,
                    }
                }
         
            }
        });
    }
   async fetchData(){
    try{
        const response= await fetch(this.dataUrl);
        if(!responde.ok) throw new Error('Failed to load data: ${response.statusText}');


        const data = await response.json();
        return data;
    } catch(error){
        console.error("Error fetching data:", error);
        return null;
    }
   }
   async init(){
    const data = await this.fetchData();
    if(data) this.renderChart(data);
   }
} 
 
 document.addEventListener("DOMContentLoaded",()=>{
    const chart = new radarChart("rdarChart","radarData.json");
    chart.init();
 });
</script>
</html>
